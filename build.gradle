buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://cdn.fox2code.com/maven' }
    }
    dependencies {
        classpath('com.fox2code.FoxLoader:dev:2.0-alpha15')
    }
}

apply plugin: 'foxloader.dev'

group = 'com.fox2code'
version = '2.0.0'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

jar {
    from "LICENSE"
}

foxloader {
    modId = "hmf"
    modName = "HowManyFoxes"
    modIcon = "assets/hmf/modmenu.png"
    modVersion = project.version
    modMain = "com.fox2code.howmanyfoxes.HowManyFoxes"
    modDesc("A HowManyItems port, but for ReIndev.")
}
